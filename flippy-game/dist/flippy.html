<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flippy – Le pulizie del dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Flippy – Le pulizie del dungeon
   Palette presa dalle variabili Figma "Flippy" */
:root{
  --bg-dungeon:#1E1A2B; --bg-stone:#3A3450; --bg-stone-light:#544C6E;
  --panel:#2B2338; --border:#8A6B4A; --flippy:#F28C28; --gold:#F5C542;
  --parchment:#F3E3B5; --text:#F4EEE0; --text-dark:#2B2338; --muted:#A89FBF;
  --danger:#D9534F; --good:#6CC070;
  --px: 'Pixelify Sans', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0c16;color:var(--text);font-family:var(--px);overflow:hidden}
img{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;user-select:none}
button{font-family:var(--px);cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Palco fisso 1280x720, scalato per stare nella finestra */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;background:var(--bg-dungeon);overflow:hidden;flex:none}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.hidden{display:none!important}

/* Elementi comuni */
.panel{background:var(--panel);border:3px solid var(--border);border-radius:14px}
.btn{background:var(--flippy);color:var(--text-dark);font-weight:600;font-size:22px;padding:14px 26px;border-radius:12px;border:3px solid var(--bg-dungeon);box-shadow:0 4px 0 #8a4a12;transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4a12}
.btn:disabled{background:var(--bg-stone-light);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--muted);border:2px solid var(--bg-stone-light);box-shadow:none;font-size:16px;padding:8px 14px}
.gold{color:var(--gold)} .muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--danger)}
.coin{width:28px;height:28px;vertical-align:middle}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--bg-stone-light)}
.tag.legno{background:#8a6b4a}.tag.nascosta{background:#3e8a4f}.tag.mortale{background:var(--danger)}.tag.ferro,.tag.pietra,.tag.visibile{background:#6a6285}

/* ---------- TITOLO ---------- */
#scr-title{background:radial-gradient(ellipse at 50% 30%,#3a2d4f 0%,var(--bg-dungeon) 70%)}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.title-wrap h1{font-size:120px;color:var(--flippy);letter-spacing:6px;text-shadow:6px 6px 0 #4a0822}
.title-wrap h2{font-size:30px;color:var(--gold);font-weight:400}
.title-wrap .hero{width:192px;height:192px;animation:bob 1.2s ease-in-out infinite}
.title-wrap .credits{position:absolute;bottom:18px;font-size:13px;color:var(--muted);text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- PROLOGO (tavolo del Master) ---------- */
#scr-prologue{background:var(--bg-dungeon)}
.tbl-glow{position:absolute;left:90px;top:-260px;width:1100px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,197,66,.28),rgba(245,197,66,0))}
.tbl-lamp{position:absolute;left:604px;top:40px;width:72px;height:24px;background:var(--gold);border-radius:24px 24px 4px 4px}
.tbl-lamp::before{content:"";position:absolute;left:34px;top:-40px;width:4px;height:40px;background:#4a0822}
.tbl-wood{position:absolute;left:0;top:360px;width:1280px;height:360px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA3UlEQVR4nO2WsQrCMBCG/8oNroI41cVV8BEU+hji4/kcgg/h4uBUOkixUDoUl7prcuTwclnyr7n8+SF3yVfs18up2q6QSgQAr35MFmAmKW6Ht3qtKEAM5QAExLnb0FoCgLpLNwV0OmzUzM7XB6R+1LSDWgAAkPo5m/De9MEG/9Ymn4IcoDjuyknLrO5GlIu5aA9pvwFSP/KxwOX2hAUnEMcCFpwQ3ISx/ovkU5ADEHdf32sx+oB9Byw4QZUHfOI4QZ0HfPKd89OElizgDGCtHECVB3ziOEGdB7gQLn0ADF1tQ3PdiHkAAAAASUVORK5CYII=) 0 0/64px 64px;image-rendering:pixelated;border-top:8px solid #9a5c36}
.abs{position:absolute}
.sheet{position:absolute;left:1090px;top:420px;transform:rotate(6deg);background:var(--parchment);color:var(--text-dark);padding:10px 12px;border-radius:3px;font-size:13px;line-height:1.35}
.sheet b{font-size:11px}
.chip{position:absolute;top:20px;background:rgba(43,35,56,.9);border:2px solid var(--gold);color:var(--gold);border-radius:8px;padding:8px 14px;font-weight:600;font-size:16px}

/* Box di dialogo (prologo, PNG) */
.dialog{position:absolute;left:40px;right:40px;bottom:20px;display:flex;gap:24px;padding:20px 24px;background:var(--panel);border:4px solid var(--border);border-radius:16px}
.dialog.master{border-color:var(--gold)}
.dialog .portrait{width:140px;height:140px;flex:none;border-radius:12px;background:var(--bg-stone);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;overflow:hidden}
.dialog .portrait img{width:128px;height:128px}
.dialog .body{flex:1;display:flex;flex-direction:column;gap:12px}
.dialog .who{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:20px}
.dialog .line{font-size:21px;line-height:1.35;min-height:84px}
.dialog .foot{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--bg-stone-light)}.dots i.on{background:var(--gold)}
.small-btn{background:var(--flippy);color:var(--text-dark);font-weight:600;font-size:16px;padding:8px 16px;border-radius:8px}
.choices{display:flex;gap:16px}
.choice{flex:1;text-align:left;background:var(--bg-stone);border:3px solid var(--bg-stone-light);border-radius:10px;padding:12px 16px;transition:transform .08s}
.choice:hover{transform:translateY(-2px);border-color:var(--gold)}
.choice b{display:block;font-size:18px;margin-bottom:4px}
.choice span{font-size:15px;color:var(--muted)}
.choice.a{border-color:var(--good)}.choice.b{border-color:var(--gold)}

/* ---------- CARRETTO ---------- */
#scr-shop{padding:28px 40px}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shop-head h1{font-size:36px;color:var(--gold)}
.shop-head p{font-size:16px;color:var(--muted)}
.budget{display:flex;align-items:center;gap:10px;padding:10px 18px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);font-size:28px;font-weight:600;color:var(--gold)}
.budget img{width:32px;height:32px}
.shop-body{display:flex;gap:24px}
.catalog{width:808px}
.catalog h3{font-size:15px;color:var(--muted);margin:6px 0 8px}
.cards{display:flex;gap:12px}
.card{width:152px;padding:10px;border-radius:12px;background:var(--panel);border:2px solid var(--bg-stone-light);display:flex;flex-direction:column;align-items:center;gap:6px}
.card.sel{border:3px solid var(--flippy)}
.card img.ico{width:64px;height:64px}
.card .nm{font-size:16px;font-weight:600;text-align:center;min-height:20px}
.card .pr{font-size:18px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:6px}
.card .pr img{width:20px;height:20px}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:18px}
.card .own{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;width:100%}
.qty button{flex:1;background:var(--flippy);color:var(--text-dark);font-weight:600;border-radius:8px;padding:6px 0;font-size:14px}
.qty button.minus{flex:0 0 32px;background:var(--bg-stone-light);color:var(--text)}
.qty button:disabled{background:var(--bg-stone);color:var(--muted);cursor:not-allowed}
.cart{width:368px;height:560px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cart h2{font-size:20px}
.cart .rows{display:flex;flex-direction:column;gap:6px;font-size:17px}
.cart .row{display:flex;justify-content:space-between}
.cart hr{border:none;height:2px;background:var(--border)}
.note{background:var(--parchment);color:var(--text-dark);border-radius:6px;padding:12px 14px;font-size:16px;line-height:1.3}
.note b{font-size:13px;display:block;margin-bottom:4px}
.cart .grow{flex:1}
.cart .btn{width:100%}

/* ---------- STANZA ---------- */
.room-bg{position:absolute;left:0;top:0;width:1280px;height:560px;overflow:hidden}
.room-wall{position:absolute;left:0;top:0;width:1280px;height:250px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABx0lEQVR4nM1XsU7DMBB9jbJZ+QQPUZeysDAhpG7wCUyI7+A7WdqlypAOWZHlGaYLl8vZ54QCfVtjv7tn997lsnl9fvvECgzDGafugIf7xzX0kV8DQAgfAIAYAwDAuWZRMOITvG/R991sX4xhFrviP5xrkslJHCXI7aHknEPxJarZEwFKxsnydPLmNI4UkxQQY5hs7vtu9kxCnowL1MSoAmIM8L6d/A2UdLe7XVwXlFirBY7N0/5llQsA4NQdsG1v1tJx6g7YbP3dagGXQJ3y8aV8bvFr6WEN2h7uac3fFp9g2jAFnnBpgZoCUo0m9ZwjZ1dapzjet1MbElLWSbVXDquTOteMcfq++xbwk2vUhEik4tcWcRjOxcm1WBb/evuAhV+ZB9aihJ/qFRUt5lBiv1ziXKOqAL1CKWmMYbRNqRC+LzfkjAI0aJ63Xq3aK9i63YkA7YQlUw2taQKda7I3V3OfHo/vWbWaCM5PCczFvd4+8OfzQM4qS/qEFkfj07dDlSJpgS3QUJtbJ1DBqn1AVq0mUKtsGuFT4MVI/CoViEM7laxs69uB4sheUfPPKOtv4GS5t3SekIebzAPW+7ykT+T4Gv69D3wBCsJGvvjwp0sAAAAASUVORK5CYII=) 0 0/64px 64px}
.room-floor{position:absolute;left:0;top:250px;width:1280px;height:310px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABp0lEQVR4nN2WTUvEMBCGZ5de2lsLhdaC4IIg6N27R3+Gf1tQL6UtLbsH3cabHiQhTSeZzNSLvrfm85lMpnl3jw9PXyDQOA0wTG9wd3MvmW7mJwAAH+d30SJaW+bvsca6alZtSs3kYjFjggB6465vF99KzZCmGblYzJggwMvr86JTg0gWFgGkaQbH02i+fUeKpQhrYwMAABR5aSDSNEMh9MlQbTGA6CXUcnMvjRLgJ71YMCiAPgU391SUIfnukQFw6Yq8ZG9ClSGW0r3dGZJ9/L6NYqrlcHWNA1Dq+tZsjG0U+xNy04gCSCL0VQzA+vLa41AAKkJfNfgA3ajtcck4DegkTBrC/mNy5mPaXV7cip7j31Ky9T3/n35gi+qqYfkCFoDtD3zq+pb1fAcB3HKT+oMQsBdAqdn7+HCtVwjYC0D99Xw6nkbjJ2JAVwDYpNCv1FWRl+Y5V59nHkBdNWh0dipCBtUGs0GiAdycY5FyUqPUDEVe8i6hfdzYglRe7f6YalkBdH27qHd3Qer4sX5RFbgbUoaUY1JIPyCx3bFQbjvLD2D6837gG4nu+IoNVyplAAAAAElFTkSuQmCC) 0 0/64px 64px;box-shadow:inset 0 10px 0 rgba(13,10,20,.45)}
.room-wall,.room-floor{image-rendering:pixelated}
.room-door{position:absolute;left:560px;top:90px;width:160px;height:160px}
.theme-2 .room-wall,.theme-2 .room-floor,.theme-2 .room-door{filter:brightness(.75) hue-rotate(-20deg)}
.theme-3 .room-wall,.theme-3 .room-floor,.theme-3 .room-door{filter:sepia(.5) hue-rotate(-40deg) saturate(1.6) brightness(.8)}
.dirt{position:absolute;width:64px;height:64px;transition:transform .15s,opacity .3s}
.dirt img{width:100%;height:100%}
.dirt:hover{transform:scale(1.12)}
.dirt.big{width:128px;height:128px}
.dirt.gone{opacity:0;pointer-events:none;transform:scale(.4)}
.dirt.special::after{content:"!";position:absolute;right:-4px;top:-10px;background:var(--gold);color:var(--text-dark);font-weight:600;font-size:13px;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px}
.barrel{animation:shake 2.2s infinite}
@keyframes shake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-6deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-3deg)}}
.slot{position:absolute;width:150px;height:72px;border:2px dashed rgba(244,238,224,.6);border-radius:12px;background:rgba(30,26,43,.35);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:rgba(244,238,224,.8)}
.slot.hover,.slot.target{border-color:var(--flippy);background:rgba(242,140,40,.18);color:var(--flippy)}
.slot img{width:64px;height:64px}
.slot.filled{border-style:solid;border-color:rgba(244,238,224,.35);cursor:pointer}
.slot.locked{border-color:var(--danger);color:var(--danger);font-size:13px;text-align:center;padding:4px}
.flippy{position:absolute;width:96px;height:96px;transition:left .35s ease,top .35s ease;pointer-events:none}
.flippy img{width:100%;height:100%}
.flippy.hop img{animation:hop .35s}
@keyframes hop{50%{transform:translateY(-18px)}}
.hud{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:18px;padding:10px 16px;background:rgba(43,35,56,.92);border:2px solid var(--border);border-radius:10px;font-weight:600;font-size:18px}
.hud .sep{width:2px;height:24px;background:var(--border)}
.hud .money{font-size:22px;color:var(--gold);display:flex;align-items:center;gap:8px}
.hud .timer.late{color:var(--danger)}
.postit{position:absolute;right:24px;top:22px;width:260px;padding:16px 18px;background:var(--parchment);color:var(--text-dark);transform:rotate(-3deg);box-shadow:4px 6px 0 rgba(0,0,0,.35);border-radius:4px;cursor:zoom-in}
.postit h4{font-size:16px;margin-bottom:6px}
.postit li{list-style:none;font-size:17px;line-height:1.35}
.postit li.new{color:#b0262c}
.postit li s{opacity:.6}
.postit::before{content:"";position:absolute;left:50%;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--danger)}
.postit.big{transform:rotate(0) scale(1.35);transform-origin:top right;z-index:5}
.mtoast{position:absolute;left:50%;top:290px;transform:translateX(-50%);max-width:820px;padding:10px 16px;background:rgba(30,26,43,.92);border:1px solid rgba(245,197,66,.6);border-radius:10px;font-size:18px;text-align:center;z-index:4;transition:opacity .3s}
.mtoast b{color:var(--gold);margin-right:6px}
.inv{position:absolute;left:0;top:560px;width:1280px;height:160px;background:var(--panel);border-top:4px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 24px}
.inv .grp h5{font-size:14px;color:var(--muted);margin-bottom:8px}
.inv .grp .row{display:flex;gap:8px}
.inv .div{width:2px;height:110px;background:var(--border)}
.inv .grow{flex:1}
.islot{position:relative;width:92px;height:100px;border-radius:10px;background:var(--bg-stone);border:2px solid var(--bg-stone-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}
.islot img{width:56px;height:56px;pointer-events:none}
.islot span{font-size:13px;font-weight:600;pointer-events:none}
.islot .n{position:absolute;right:5px;top:5px;background:var(--gold);color:var(--text-dark);font-size:12px;font-weight:600;padding:1px 6px;border-radius:8px}
.islot.empty{opacity:.4}
.islot.empty .n{background:var(--bg-stone-light);color:var(--text)}
.islot.sel{border:3px solid var(--flippy)}
.drag-ghost{position:absolute;width:64px;height:64px;pointer-events:none;z-index:50;opacity:.9}
.float{position:absolute;font-weight:600;font-size:20px;color:var(--gold);pointer-events:none;animation:floatUp .9s forwards;z-index:20}
@keyframes floatUp{to{transform:translateY(-40px);opacity:0}}

/* Modale (PNG, conferme) */
#modal{position:absolute;inset:0;background:rgba(13,10,20,.55);z-index:30}
.npc-art{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:256px;height:256px}
.npc-art img{width:100%;height:100%}

/* Toast generico */
#toast{position:absolute;left:50%;top:24px;transform:translateX(-50%);background:var(--gold);color:var(--text-dark);font-weight:600;padding:10px 18px;border-radius:10px;z-index:60;font-size:18px}

/* ---------- RESOCONTO ---------- */
#scr-report{padding:30px 40px}
#scr-report h1{font-size:36px;color:var(--gold)}
#scr-report .sub{font-size:16px;color:var(--muted);margin:6px 0 16px}
.rep{display:flex;gap:40px}
.rep-l{width:500px;height:540px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.die{width:120px;height:120px;background:var(--text);border:4px solid var(--bg-dungeon);border-radius:18px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;animation:roll .8s ease-out}
.die i{width:22px;height:22px;border-radius:50%;background:var(--bg-dungeon);margin:auto;visibility:hidden}
.die i.on{visibility:visible}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}70%{transform:rotate(15deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
.vote{font-size:28px;font-weight:600}
.rtab{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:17px}
.rtab th{font-size:13px;color:var(--muted);text-align:center}.rtab th:first-child{text-align:left}
.rtab td{background:var(--bg-stone);padding:6px 10px;text-align:center}
.rtab td:first-child{text-align:left;border-radius:6px 0 0 6px}.rtab td:last-child{border-radius:0 6px 6px 0}
.pay{width:100%;font-size:18px;display:flex;flex-direction:column;gap:6px}
.pay div{display:flex;justify-content:space-between}
.rep-r{width:660px;min-height:440px;background:var(--parchment);color:var(--text-dark);border-radius:6px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.rep-r h3{font-size:20px}
.rep-r p{font-size:19px;line-height:1.35}
#scr-report .btn{position:absolute;right:40px;bottom:30px}

/* ---------- STAGNO ---------- */
#scr-pond{background:#24324A}
.pond-water{position:absolute;left:56px;top:296px;width:768px;height:384px;border-radius:192px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABEklEQVR4nMWWrw7CMBCHf0uWyWUGhZlAIQiPg0GCgKAweN4Bg+TF5jEEiQFB2qTrv2t3bU9uTb4v17veVYvN+QtLNG1n+8UWdSmwUSAnGAA+79dfoARYRD2G7w5bAMD99kgKFlEt91dZhLO+1w48hyEJWIRSAxwwKlhk3tgFOcAiWAVCwKwCMWAWgSngSQI28PFyAhDWwkobxoIBYL5aa98oXUXKACXVsS3sFOC44yiBHGCjQE6wIlACLAVs8FwjWquB3LuBFCi1lGgLiSk4l5TxlXtfQq4lxVZr3pdw6pLi67AkCwkFLIJdIPRNYRNwgV1jOmgch4KbtvMWcXQGqKn2FXGwAPfcIAukGlhegdST8gcW7IR4uZpY3wAAAABJRU5ErkJggg==) 0 0/64px 64px;image-rendering:pixelated;border:8px solid #1d3a24}
.moon{position:absolute;left:1080px;top:40px;width:90px;height:90px;border-radius:50%;background:var(--text);box-shadow:0 0 40px rgba(244,238,224,.4)}
.pond-title{position:absolute;left:40px;top:30px}
.pond-title h1{font-size:36px;color:var(--gold)}
.pond-title p{font-size:18px}
.pond-panel{position:absolute;left:860px;top:170px;width:380px;padding:24px;display:flex;flex-direction:column;gap:14px}
.exp{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-stone);border-radius:8px;font-size:18px;text-align:left;width:100%}
.exp .cb{width:22px;height:22px;border:2px solid var(--flippy);border-radius:4px;flex:none}
.exp.on .cb{background:var(--flippy)}
.exp .grow{flex:1}
.exp:disabled{opacity:.45;cursor:not-allowed}
.tad{position:absolute;width:64px;height:64px;animation:swim 3s ease-in-out infinite}
@keyframes swim{50%{transform:translateX(-14px)}}

/* ---------- FINALE ---------- */
#scr-ending{background:radial-gradient(ellipse at 50% 40%,#3a2d4f 0%,var(--bg-dungeon) 70%)}
.end-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 160px}
.end-wrap .kicker{color:var(--muted);font-size:18px;letter-spacing:2px}
.end-wrap h1{font-size:64px;color:var(--gold);text-shadow:4px 4px 0 #4a0822}
.end-wrap p{font-size:22px;line-height:1.4}
.end-wrap .art{display:flex;gap:16px;align-items:flex-end}
.end-wrap .art img{width:128px;height:128px}
.bars{display:flex;gap:30px;font-size:16px;color:var(--muted)}
.bar{width:180px;height:12px;background:var(--bg-stone);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}

/* ---------- SESSIONE 2 ---------- */
.theme-4 .room-wall,.theme-4 .room-floor,.theme-4 .room-door{filter:hue-rotate(70deg) saturate(.8) brightness(.62)}
.theme-5 .room-wall,.theme-5 .room-floor,.theme-5 .room-door{filter:sepia(.7) saturate(1.8) hue-rotate(5deg) brightness(.8)}
.dirt.vivo img{animation:scuttle 1.6s steps(2) infinite}
@keyframes scuttle{0%{transform:translateX(0)}50%{transform:translateX(6px) rotate(6deg)}100%{transform:translateX(0)}}
/* carte e inventario si stringono quando ci sono più oggetti */
.card{flex:1 1 0;min-width:0;width:auto;max-width:152px}
.islot{width:82px}
.islot img{width:48px;height:48px}
.inv{gap:18px}

</style>
</head>

/* =========================================================
   FLIPPY – LE PULIZIE DEL DUNGEON
   Logica di gioco (vanilla JS, nessuna dipendenza)
   ========================================================= */
(() => {
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
// Percorso di uno sprite. (La versione "file unico" inserisce le immagini in window.ASSETS.)
const A = name => (window.ASSETS && window.ASSETS[name]) || `assets/${name}.png`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const stage = $('#stage');

/* ---------- Scala del palco ---------- */
let scale = 1;
function fit() {
  scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fit); fit();
function toStage(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

/* ---------- Suoni (WebAudio, niente file) ---------- */
let actx = null;
function sfx(type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    const map = { click: [520, .05], coin: [880, .12], clean: [660, .08], bad: [160, .18], place: [330, .1], dice: [440, .3] };
    const [f, d] = map[type] || map.click;
    o.type = type === 'bad' ? 'sawtooth' : 'square';
    o.frequency.value = f;
    if (type === 'coin') o.frequency.setValueAtTime(1320, actx.currentTime + .06);
    g.gain.value = .04; g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (_) { /* audio non disponibile: pazienza */ }
}

/* ---------- Stato ---------- */
let S;
function newGame() {
  S = {
    money: BUDGET_INIZIALE,
    level: 0,          // 0 = sessione 1, 1 = sessione 2
    tools: { scopa: 0, sacco: 0, sale: 0, pozione: 0, retino: 0 },   // usi rimasti
    traps: { frecce: 0, fossa: 0, frecce_nascoste: 0, tagliola: 0, masso: 0, rete: 0 },
    history: [],       // risultati delle sessioni precedenti
    cousin: null, goblinRevenge: null, marco: null, d20: null,
    elmo: false,
    roomIndex: 0,
    results: [],
    goblin: null,      // 'tenuto' | 'denunciato'
    bribe: null,       // true = tangente accettata
    adventurer: null,  // 'salvato' | 'rifiutato'
    repMaster: 0, repCreature: 0,
    goblinFine: 0,
    pond: { cibo: false, caldo: false },
  };
}

const rooms = () => (S.level === 0 ? ROOMS : ROOMS_2);
const unlocked = d => !d.livello || d.livello <= S.level + 1;

/* ---------- Navigazione tra schermate ---------- */
let roomTimer = null;
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#scr-' + id).classList.add('active');
  if (id !== 'room') clearInterval(roomTimer);
  $('#toast').classList.add('hidden');
}
function toast(text, ms = 1800) {
  const t = $('#toast'); t.textContent = text; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}
function floatText(text, x, y, color) {
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = text; f.style.left = x + 'px'; f.style.top = y + 'px';
  if (color) f.style.color = color;
  stage.appendChild(f); setTimeout(() => f.remove(), 950);
}

/* ---------- Modale di dialogo (PNG / Master) ---------- */
let modalOpen = false;
function openDialog({ art, artBig, name, color = 'var(--gold)', line, choices }) {
  modalOpen = true;
  const m = $('#modal');
  m.innerHTML = `
    ${artBig ? `<div class="npc-art"><img src="${A(artBig)}" alt=""></div>` : ''}
    <div class="dialog" style="border-color:${color}">
      <div class="portrait" style="border-color:${color}"><img src="${A(art)}" alt=""></div>
      <div class="body">
        <div class="who"><span style="color:${color}">${name}</span></div>
        <div class="line">${line}</div>
        <div class="choices"></div>
        <div class="muted" style="font-size:14px">Le conseguenze delle tue scelte si scoprono al resoconto.</div>
      </div>
    </div>`;
  const box = $('.choices', m);
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice ' + (i === 0 ? 'a' : 'b');
    b.innerHTML = `<b>${String.fromCharCode(65 + i)})  ${c.label}</b><span>${c.sub}</span>`;
    if (c.disabled) { b.disabled = true; b.style.opacity = .45; b.style.cursor = 'not-allowed'; }
    b.onclick = () => { sfx('click'); closeDialog(); c.onPick(); };
    box.appendChild(b);
  });
  m.classList.remove('hidden');
}
function closeDialog() { $('#modal').classList.add('hidden'); modalOpen = false; setTimeout(runQueue, 300); }
const queue = [];
function enqueue(fn) { queue.push(fn); runQueue(); }
function runQueue() { if (!modalOpen && queue.length && $('#scr-room').classList.contains('active')) queue.shift()(); }

/* =========================================================
   CARRETTO DEL MASTER (negozio prima di ogni stanza)
   ========================================================= */
let cart = {};
const SHOP_NOTES = [[
  '«Ti ho dato 100 monete, non un mutuo. Spendile con la testa.»',
  '«Il corridoio ha slime. Gli slime odiano il sale. Te lo dico solo perché sono buono.»',
  '«Ultima spesa. La sala del boss deve fare paura. E c\'è uno slime enorme, sappilo.»',
], [
  '«Gli attrezzi avanzati la settimana scorsa ce li hai ancora. Controlla prima di ricomprare.»',
  '«Tesoreria: UNA trappola mortale, non due. E tieni qualcosa da parte: tiro il d20.»',
]];
function cartCost() {
  let c = 0;
  for (const [k, n] of Object.entries(cart)) c += (TOOLS[k] || TRAPS[k]).prezzo * n;
  return c;
}
function renderShop() {
  const room = rooms()[S.roomIndex];
  const left = S.money - cartCost();
  const card = (key, def, isTool) => {
    const n = cart[key] || 0;
    const owned = isTool ? S.tools[key] : S.traps[key];
    const atMax = def.max && (owned + n * (isTool ? def.usi : 1)) >= def.max;
    const canBuy = left >= def.prezzo && !atMax;
    const tags = isTool
      ? `<span class="tag">${def.usi} ${def.usi === 1 ? 'uso' : 'usi'}</span>${def.max ? '<span class="tag mortale">max 1</span>' : ''}`
      : `<span class="tag ${def.materiale}">${cap(def.materiale)}</span><span class="tag ${def.visibile ? 'visibile' : 'nascosta'}">${def.visibile ? 'Visibile' : 'Nascosta'}</span>${def.mortale ? '<span class="tag mortale">Mortale</span>' : ''}`;
    return `<div class="card ${n ? 'sel' : ''}">
      <img class="ico" src="${A(def.img)}" alt="">
      <div class="nm">${def.nome}${def.livello && S.level === 1 ? ' <span class="tag mortale" style="background:var(--good)">NUOVO</span>' : ''}</div>
      <div class="pr"><img src="${A('moneta')}" alt="">${def.prezzo}</div>
      <div class="tags">${tags}</div>
      <div class="own">Hai: ${owned}${isTool ? ' usi' : ''}${n ? ` · +${n} nel carretto` : ''}</div>
      <div class="qty">
        <button class="minus" data-k="${key}" data-d="-1" ${n ? '' : 'disabled'} aria-label="Togli">−</button>
        <button data-k="${key}" data-d="1" ${canBuy ? '' : 'disabled'}>COMPRA</button>
      </div></div>`;
  };
  const rows = Object.entries(cart).filter(([, n]) => n).map(([k, n]) => {
    const d = TOOLS[k] || TRAPS[k];
    return `<div class="row"><span>${d.nome} ×${n}</span><span class="gold">${d.prezzo * n}</span></div>`;
  }).join('') || '<div class="muted">Il carretto è vuoto.</div>';
  $('#scr-shop').innerHTML = `
    <div class="shop-head">
      <div><h1>IL CARRETTO DEL MASTER</h1><p>${S.level ? 'Sessione 2 · ' : ''}Prima della stanza «${room.nome}» — il budget vale per tutta la sessione</p></div>
      <div class="budget"><img src="${A('moneta')}" alt="">${left}</div>
    </div>
    <div class="shop-body">
      <div class="catalog">
        <h3>ATTREZZI</h3><div class="cards">${Object.entries(TOOLS).filter(([, d]) => unlocked(d)).map(([k, d]) => card(k, d, true)).join('')}</div>
        <h3 style="margin-top:14px">TRAPPOLE</h3><div class="cards">${Object.entries(TRAPS).filter(([, d]) => unlocked(d)).map(([k, d]) => card(k, d, false)).join('')}</div>
      </div>
      <div class="cart panel">
        <h2>NEL CARRETTO</h2>
        <div class="rows">${rows}</div>
        <hr>
        <div class="rows">
          <div class="row"><b>Totale</b><span class="gold">${cartCost()}</span></div>
          <div class="row"><span>Restano dopo l'acquisto</span><span class="gold">${left}</span></div>
        </div>
        ${S.elmo ? `<button class="btn ghost" id="btn-elmo" style="width:100%;color:var(--gold);border-color:var(--gold)">VENDI L'ELMO ABBANDONATO +20</button>` : ''}
        <div class="note"><b>MASTER:</b>${SHOP_NOTES[S.level][S.roomIndex]}</div>
        <div><div class="muted" style="font-size:13px;font-weight:600">PROSSIMA STANZA</div>
          <div style="font-size:16px">${room.nome} · ${room.slots.length} slot · ${room.regole.length} regole</div></div>
        <div class="grow"></div>
        <button class="btn" id="btn-go">VAI: ${room.nome.toUpperCase()} →</button>
      </div>
    </div>`;
  $('#scr-shop').querySelectorAll('.qty button').forEach(b => b.onclick = () => {
    const k = b.dataset.k, d = +b.dataset.d;
    cart[k] = Math.max(0, (cart[k] || 0) + d);
    sfx(d > 0 ? 'coin' : 'click'); renderShop();
  });
  const be = $('#btn-elmo');
  if (be) be.onclick = () => { S.elmo = false; S.money += 20; sfx('coin'); toast('Elmo venduto: +20 monete'); renderShop(); };
  $('#btn-go').onclick = () => {
    sfx('click');
    S.money -= cartCost();
    for (const [k, n] of Object.entries(cart)) {
      if (TOOLS[k]) S.tools[k] += TOOLS[k].usi * n; else S.traps[k] += n;
    }
    cart = {};
    startRoom();
  };
}
const cap = s => s[0].toUpperCase() + s.slice(1);

/* =========================================================
   STANZA
   ========================================================= */
let R; // stato della stanza corrente
function startRoom() {
  const def = rooms()[S.roomIndex];
  R = {
    def,
    dirt: def.sporco.map((d, i) => ({ ...d, id: i, done: false })),
    slotPos: def.slots.map(p => ({ ...p })),
    slots: def.slots.map(() => null),
    selTool: null, selTrap: null,
    time: DURATA_STANZA, lateSaid: false,
    actions: 0, ruleChanged: false, npcDone: false,
    specials: Object.fromEntries(def.speciali.map(s => [s, true])),
  };
  // Conseguenze delle scelte passate
  if (def.id === 3 && S.bribe === false) R.dirt.push({ tipo: 'ossa', x: 700, y: 480, id: 99, done: false, extra: true });
  if (def.id === 2 && S.bribe === true) R.slots[1] = 'locked';
  const goblinCleans = S.goblin === 'tenuto' && def.id > 1;
  if (goblinCleans) R.dirt.forEach(d => { if (d.tipo === 'ossa') d.done = true; });
  if (S.cousin && def.id === 5) R.dirt.forEach(d => { if (d.tipo === 'ragno') d.done = true; });

  renderRoom();
  show('room');
  say(def.battutaIngresso, 4200);
  if (goblinCleans) setTimeout(() => toast('Il goblin ha già pulito le ossa per te!', 2600), 800);

  clearInterval(roomTimer);
  roomTimer = setInterval(tick, 1000);

  // Eventi programmati per stanza
  if (def.id === 2 && S.bribe === null) setTimeout(() => enqueue(eventBoss), 3500);
  if (def.id === 4 && !S.goblinRevenge) setTimeout(() => enqueue(eventGoblinReturn), 3500);
  if (S.cousin && def.id === 5) setTimeout(() => toast('Il cugino goblin ha già acchiappato i ragni!', 2600), 800);
}

function tick() {
  if (modalOpen) return;
  R.time = Math.max(0, R.time - 1);
  const t = $('#hud-timer');
  if (t) { t.textContent = fmt(R.time); t.classList.toggle('late', R.time <= 20); }
  if (R.time === 0 && !R.lateSaid) { R.lateSaid = true; say(QUIPS.tempoScaduto, 3000); sfx('bad'); }
  const elapsed = DURATA_STANZA - R.time;
  if (R.def.id === 1 && !S.goblin && elapsed === 25) enqueue(eventGoblin);
  if (R.def.id === 3 && !S.adventurer && elapsed === 30) enqueue(eventAdventurer);
  if (R.def.id === 3 && !R.ruleChanged && elapsed === 45) changeRule();
  if (R.def.id === 5 && !S.marco && elapsed === 20) enqueue(eventMarco);
  if (R.def.id === 5 && !S.d20 && elapsed === 35) enqueue(rollD20);
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function renderRoom() {
  const def = R.def;
  const el = $('#scr-room');
  el.className = 'screen active theme-' + def.tema;
  const regole = def.regole.map(r => `<li>• ${r}</li>`).join('')
    + (R.ruleChanged ? `<li class="new">• ${def.regolaNuova}!!</li>` : '');
  el.innerHTML = `
    <div class="room-bg">
      <div class="room-wall"></div><div class="room-floor"></div>
      <img class="room-door" src="${A('porta')}" alt="">
      <div id="dirt-layer"></div>
      <div id="slot-layer"></div>
      <div class="flippy" id="flippy" style="left:${def.flippy.x}px;top:${def.flippy.y}px"><img src="${A('flippy')}" alt="Flippy"></div>
    </div>
    <div class="hud">
      <span class="money"><img class="coin" src="${A('moneta')}" alt="">${S.money}</span><span class="sep"></span>
      <span>${S.level ? 'S2 · ' : ''}STANZA ${S.roomIndex + 1}/${rooms().length} · ${def.nome.toUpperCase()}</span><span class="sep"></span>
      <span>⏳ <span class="timer" id="hud-timer">${fmt(R.time)}</span></span>
    </div>
    <div class="postit" id="postit" title="Clicca per ingrandire"><h4>APPUNTI DEL MASTER</h4><ul>${regole}</ul><div style="font-size:14px;opacity:.7">${def.notaRegole}</div></div>
    <div class="mtoast hidden" id="mtoast"></div>
    <div class="inv" id="inv"></div>`;
  $('#postit').onclick = () => $('#postit').classList.toggle('big');
  renderDirt(); renderSlots(); renderInv();
}

function renderDirt() {
  const layer = $('#dirt-layer'); layer.innerHTML = '';
  R.dirt.forEach(d => {
    const info = DIRT[d.tipo];
    const b = document.createElement('button');
    b.className = 'dirt' + (info.big ? ' big' : '') + (info.vivo ? ' vivo' : '') + (d.done ? ' gone' : '');
    b.style.left = d.x + 'px'; b.style.top = d.y + 'px';
    b.innerHTML = `<img src="${A(info.img)}" alt="${info.nome}">`;
    b.title = `${cap(info.nome)} – serve: ${TOOLS[info.tool].nome}`;
    b.onclick = () => cleanDirt(d, b);
    layer.appendChild(b);
  });
  // Oggetti speciali (stanza 1)
  const sp = [
    ['tagliola_rotta', 'tagliola', 650, 490, 'Tagliola rotta', 'opacity:.75;transform:rotate(-18deg)'],
    ['elmo', 'elmo', 1120, 300, 'Elmo abbandonato', ''],
    ['barile', 'barile', 60, 220, 'Un barile... si muove?', ''],
    ['forziere', 'forziere', 576, 200, 'Il forziere: l\'esca della tesoreria', ''],
  ];
  sp.forEach(([key, img, x, y, title, st]) => {
    if (!R.specials[key]) return;
    const b = document.createElement('button');
    b.className = 'dirt special' + (key === 'barile' ? ' barrel' : '');
    b.style.left = x + 'px'; b.style.top = y + 'px';
    if (key === 'barile') { b.style.width = '96px'; b.style.height = '96px'; }
    if (key === 'forziere') { b.style.width = '128px'; b.style.height = '128px'; b.classList.remove('special'); }
    b.innerHTML = `<img src="${A(img)}" alt="" style="${st}">`;
    b.title = title;
    b.onclick = () => special(key, b);
    layer.appendChild(b);
  });
}

function moveFlippy(x, y) {
  const f = $('#flippy'); if (!f) return;
  f.style.left = (x - 16) + 'px'; f.style.top = (y - 30) + 'px';
  f.classList.remove('hop'); void f.offsetWidth; f.classList.add('hop');
}

function cleanDirt(d, btn) {
  if (modalOpen || d.done) return;
  const need = DIRT[d.tipo].tool;
  if (!R.selTool) { say(QUIPS.nessunAttrezzo, 2500); sfx('bad'); return; }
  if (R.selTool !== need) { say(pick(QUIPS.attrezzoSbagliato) + ` (Serve: ${TOOLS[need].nome})`, 2500); sfx('bad'); return; }

/* ---------- Slot delle trappole ---------- */
function renderSlots() {
  const layer = $('#slot-layer'); layer.innerHTML = '';
  R.slotPos.forEach((p, i) => {
    const s = document.createElement('div');
    const v = R.slots[i];
    s.className = 'slot' + (v === 'locked' ? ' locked' : v ? ' filled' : '') + (R.selTrap && !v ? ' target' : '');
    s.dataset.i = i;
    s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
    s.innerHTML = v === 'locked' ? 'RISERVATO<br>AL BOSS' : v ? `<img src="${A(TRAPS[v].img)}" alt="${TRAPS[v].nome}" title="Clicca per togliere">` : `SLOT ${i + 1}`;
    s.onclick = () => slotClick(i);
    layer.appendChild(s);
  });
}
function slotClick(i) {
  if (modalOpen) return;
  const v = R.slots[i];
  if (v === 'locked') { say('«Quello slot l\'hai promesso al boss. Ricordi?»', 2200); return; }
  if (v) { S.traps[v]++; R.slots[i] = null; sfx('click'); renderSlots(); renderInv(); return; }
  if (R.selTrap) placeTrap(R.selTrap, i);
}
function placeTrap(key, i) {
  if (R.slots[i] || S.traps[key] <= 0) return;
  S.traps[key]--; R.slots[i] = key; sfx('place');
  if (S.traps[key] === 0) R.selTrap = null;
  const p = R.slotPos[i]; moveFlippy(p.x + 40, p.y - 20);
  if (Math.random() < .4) say(pick(QUIPS.trappolaMessa), 1800);
  renderSlots(); renderInv();
  if (R.def.id === 3 && !R.ruleChanged) setTimeout(changeRule, 900);
  if (R.def.id === 5 && !S.d20) setTimeout(() => enqueue(rollD20), 900);
}
function changeRule() {
  if (R.ruleChanged || R.def.id !== 3) return;
  R.ruleChanged = true;
  enqueue(() => {
    openDialog({
      art: 'master', name: 'IL MASTER', line: QUIPS.cambioRegola,
      choices: [{ label: 'OK, CAPO', sub: 'Il post-it ora dice: niente trappole di legno', onPick: () => { renderRoom(); } }],
    });
  });
}

/* ---------- Inventario + drag & drop ---------- */
function renderInv() {
  const inv = $('#inv'); if (!inv) return;
  const slot = (key, def, n, kind) => `
    <div class="islot ${n ? '' : 'empty'} ${(kind === 'tool' ? R.selTool : R.selTrap) === key ? 'sel' : ''}" data-k="${key}" data-kind="${kind}" role="button" tabindex="0" aria-label="${def.nome}, ${n}">
      <span class="n">x${n}</span><img src="${A(def.img)}" alt=""><span>${def.breve || def.nome}</span>
    </div>`;
  inv.innerHTML = `
    <div class="grp"><h5>ATTREZZI · clicca, poi clicca lo sporco</h5><div class="row">${Object.entries(TOOLS).filter(([, d]) => unlocked(d)).map(([k, d]) => slot(k, d, S.tools[k], 'tool')).join('')}</div></div>
    <div class="div"></div>
    <div class="grp"><h5>TRAPPOLE · trascina su uno slot</h5><div class="row">${Object.entries(TRAPS).filter(([, d]) => unlocked(d)).map(([k, d]) => slot(k, d, S.traps[k], 'trap')).join('')}</div></div>
    <div class="grow"></div>
    <button class="btn" id="btn-done">FATTO!</button>`;
  inv.querySelectorAll('.islot').forEach(el => {
    const k = el.dataset.k, kind = el.dataset.kind;
    if (kind === 'tool') {
      el.onclick = () => {
        if (S.tools[k] <= 0) { say(`«Non hai ${TOOLS[k].nome.toLowerCase()}. Il carretto è chiuso, ormai.»`, 2200); sfx('bad'); return; }
        R.selTool = R.selTool === k ? null : k; sfx('click'); renderInv();
      };
    } else {
      el.addEventListener('pointerdown', e => startDrag(e, k));
    }
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kind === 'tool' ? el.onclick() : toggleTrap(k); } };
  });
  $('#btn-done').onclick = finishRoom;
}
function toggleTrap(k) {
  if (S.traps[k] <= 0) { sfx('bad'); return; }
  R.selTrap = R.selTrap === k ? null : k; sfx('click'); renderInv(); renderSlots();
}
function startDrag(e, key) {
  if (modalOpen) return;
  if (S.traps[key] <= 0) { say('«Non ne hai. Dovevi comprarle.»', 1800); sfx('bad'); return; }
  e.preventDefault();
  const start = toStage(e);
  let ghost = null, moved = false;
  const move = ev => {
    const p = toStage(ev);
    if (!moved && Math.hypot(p.x - start.x, p.y - start.y) > 6) {
      moved = true;
      ghost = document.createElement('img'); ghost.src = A(TRAPS[key].img); ghost.className = 'drag-ghost';
      stage.appendChild(ghost);
    }
    if (ghost) {
      ghost.style.left = (p.x - 32) + 'px'; ghost.style.top = (p.y - 32) + 'px';
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
      const t = slotAt(ev); if (t) t.classList.add('hover');
    }
  };
  const up = ev => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    if (ghost) ghost.remove();
    if (!moved) { toggleTrap(key); return; }
    const t = slotAt(ev);
    if (t) placeTrap(key, +t.dataset.i); else renderSlots();
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function slotAt(ev) {
  const el = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList && n.classList.contains('slot'));
  return el && !el.classList.contains('locked') && !el.classList.contains('filled') ? el : null;
}

/* =========================================================
   FINE STANZA: valutazione
   ========================================================= */
function checkRules() {
  const placed = R.slots.filter(v => v && v !== 'locked').map(k => TRAPS[k]);
  const all = R.slots.every(v => v && v !== 'locked');
  switch (R.def.id) {
    case 1: return { ok: placed.length >= 1 && !placed.some(t => t.mortale), placed, all };
    case 2: return { ok: all && !placed.some(t => t.visibile), placed, all };
    case 3: return { ok: all && placed.some(t => t.mortale) && !placed.some(t => t.materiale === 'legno'), placed, all };
    case 4: return { ok: placed.filter(t => !t.visibile).length >= 2 && !placed.some(t => t.materiale === 'ferro'), placed, all };
    case 5: return { ok: all && placed.filter(t => t.mortale).length === 1 && S.marco !== 'venduto', placed, all };
  }
}
function finishRoom() {
  if (modalOpen) return;
  // Gli eventi obbligatori devono succedere prima di chiudere la stanza
  if (R.def.id === 1 && !S.goblin) { enqueue(eventGoblin); return; }
  if (R.def.id === 2 && S.bribe === null) { enqueue(eventBoss); return; }
  if (R.def.id === 3 && !S.adventurer) { enqueue(eventAdventurer); return; }
  if (R.def.id === 3 && !R.ruleChanged) { changeRule(); return; }
  if (R.def.id === 4 && !S.goblinRevenge) { enqueue(eventGoblinReturn); return; }
  if (R.def.id === 5 && !S.marco) { enqueue(eventMarco); return; }
  if (R.def.id === 5 && !S.d20) { enqueue(rollD20); return; }
  sfx('click');
  const rules = checkRules();
  const clean = R.dirt.every(d => d.done);
  const res = {
    room: R.def.id, nome: R.def.nome, clean, rules: rules.ok,
    placed: rules.placed, all: rules.all,
    slimeLeft: R.dirt.some(d => d.tipo === 'slime_gigante' && !d.done),
    dirtLeft: R.dirt.filter(d => !d.done).length,
  };
  S.results.push(res);
  if (res.rules) S.repMaster++;
  clearInterval(roomTimer);
  if (S.roomIndex < rooms().length - 1) {
    S.roomIndex++;
    renderShop(); show('shop');
  } else {
    if (S.level === 0 && S.goblin === 'tenuto' && Math.random() < .5) S.goblinFine = 10;
    if (S.level === 1) S.goblinFine = 0;
    renderReport(); show('report');
  }
}

  const E = mHigh && cHigh ? ['IL DUNGEON PERFETTO', 'Tutti contenti: il Master, le creature, perfino i giocatori. Il Master ti vuole anche per la prossima sessione.', ['master', 'flippy', 'goblin']]
    : mHigh ? ['IMPIEGATO DEL MESE', 'Il Master ti assume a tempo pieno. Peccato che ogni creatura del dungeon ora ti guardi storto.', ['master', 'flippy']]
    : cHigh ? ['LA RIVOLUZIONE', 'Le creature del dungeon fondano un sindacato e ti eleggono loro capo. Il Master è furioso.', ['goblin', 'flippy', 'slime']]
    : ['LICENZIATO', 'Il Master non ti richiama. Le creature nemmeno. Flippy torna allo stagno senza lavoro.', ['flippy']];
  const girini = S.pond.cibo && S.pond.caldo ? 'E i girini, almeno, stanno benissimo.' : 'E i girini aspettano ancora una settimana migliore.';
  const pct = (v, max) => Math.max(5, Math.min(100, ((v + 2) / (max + 2)) * 100));
  $('#scr-ending').innerHTML = `
    <div class="end-wrap">
      <div class="kicker">FINALE</div>
      <div class="art">${E[2].map(a => `<img src="${A(a)}" alt="">`).join('')}</div>
      <h1>${E[0]}</h1>
      <p>${E[1]} ${girini}</p>
      <div class="bars">
        <div>Reputazione col Master<div class="bar"><i style="width:${pct(S.repMaster, 4)}%"></i></div></div>
        <div>Reputazione con le creature<div class="bar"><i style="width:${pct(S.repCreature, 2)}%;background:var(--good)"></i></div></div>
      </div>
      <p class="muted" style="font-size:16px">Voto ${S.final.vote}/6 · ${S.final.total} monete guadagnate · Esistono 4 finali diversi.</p>
      <div style="display:flex;gap:16px;align-items:center">
        <button class="btn ghost" id="btn-again">RICOMINCIA</button>
        <button class="btn" id="btn-s2">CONTINUA: SESSIONE 2 →</button>
      </div>
    </div>`;
  S.lastEnding = E[0];
  $('#btn-again').onclick = () => { sfx('click'); renderTitle(); };
  $('#btn-s2').onclick = () => { sfx('click'); startLevel2(); };
}

/* =========================================================
   SESSIONE 2 – cosa succede dopo
   ========================================================= */
function startLevel2() {
  S.history.push({ results: S.results, final: S.final, ending: S.lastEnding });
  S.level = 1; S.roomIndex = 0; S.results = []; S.goblinFine = 0;
  const paga2 = PAGA_BASE_2 + 10 * S.final.vote;
  S.money = (S.pondLeft || 0) + paga2;
  const prev = S.history[0];
  const recap = prev.final.vote >= 5
    ? `«Ranocchia! La sessione di settimana scorsa? Voto ${prev.final.vote} su 6. I giocatori ne parlano ancora. Il mio gruppo vuole un seguito: LE CRIPTE.»`
    : prev.final.vote >= 3
      ? `«Settimana scorsa: voto ${prev.final.vote} su 6. Non male, non bene. I giocatori sono tornati comunque. Stasera si va nelle CRIPTE.»`
      : `«Settimana scorsa: voto ${prev.final.vote} su 6. Marco ha minacciato di cambiare gruppo. Stasera nelle CRIPTE devi rimediare.»`;
  const money = `«Ti avanzavano ${S.pondLeft || 0} monete: il budget di stasera è ${paga2} (${PAGA_BASE_2} più 10 per ogni punto di voto): fanno ${S.money}. Gli attrezzi che non hai usato sono ancora nel tuo inventario.»`;
  const echo = S.goblin === 'tenuto'
    ? '«Ah, e il tuo amico goblin del barile... ha detto che passa a trovarti. Con un parente.»'
    : '«Ah, il goblin che mi hai denunciato? È ancora arrabbiato con te. Occhio.»';
  renderPrologue(0, [recap, money + ' ' + echo, ...PROLOGO_2_FISSO], 'SESSIONE 2 · LE CRIPTE');
  show('prologue');
}

function eventGoblinReturn() {
  if (S.goblinRevenge) return;
  if (S.goblin === 'tenuto') {
    openDialog({
      art: 'cugino', artBig: 'cugino', name: 'IL CUGINO DEL GOBLIN', color: 'var(--good)',
      line: '«Mio cugino dice che sei una brava rana. Io acchiappo ragni meglio di qualsiasi retino. Per la tesoreria mi bastano 10 monete.»',
      choices: [
        { label: 'ASSUMILO', sub: S.money >= 10 ? '−10 monete: in tesoreria i ragni li prende lui' : 'Non hai 10 monete', disabled: S.money < 10, onPick: () => { S.goblinRevenge = 'cugino'; S.cousin = true; S.money -= 10; S.repCreature++; renderRoom(); toast('Il cugino goblin è assunto!'); } },
        { label: 'NO, GRAZIE', sub: 'Fai da sola', onPick: () => { S.goblinRevenge = 'rifiutato'; } },
      ],
    });
  } else {
    openDialog({
      art: 'goblin', artBig: 'goblin', name: 'IL GOBLIN (ARRABBIATO)', color: 'var(--danger)',
      line: '«Ti ricordi di me? Per colpa tua il Master mi ha rimesso a fare il mostro di livello 1! Dammi 15 monete... o ti riempio la cripta di ossa.»',
      choices: [
        { label: 'PAGALO', sub: S.money >= 15 ? '−15 monete, pace fatta' : 'Non hai 15 monete', disabled: S.money < 15, onPick: () => { S.goblinRevenge = 'pagato'; S.money -= 15; S.repCreature++; renderRoom(); } },
        { label: 'NON PAGARE', sub: 'Il goblin si vendica...', onPick: () => {
          S.goblinRevenge = 'sporcato';
          [[640, 300], [210, 250], [960, 470]].forEach(([x, y], i) => R.dirt.push({ tipo: 'ossa', x, y, id: 200 + i, done: false, extra: true }));
          renderRoom(); say('«Il goblin ha rovesciato tre mucchi di ossa. Che dolcezza.»', 2600);
        } },
      ],
    });
  }
}
function eventMarco() {
  if (S.marco) return;
  openDialog({
    art: 'marco', artBig: 'marco', name: 'MARCO, IL PALADINO (FUORI SESSIONE)', color: 'var(--flippy)',
    line: '«Psst. Sono Marco, il giocatore. La settimana scorsa sono morto malissimo. Dimmi dove metti le trappole della tesoreria e ti do 25 monete. Il Master non lo saprà mai.»',
    choices: [
      { label: 'DIGLIELO', sub: '+25 monete, ma la tesoreria non funzionerà', onPick: () => { S.marco = 'venduto'; S.money += 25; S.repMaster -= 2; renderRoom(); sfx('coin'); toast('+25 monete. Marco ti fa l\'occhiolino.'); } },
      { label: 'MANDALO VIA', sub: '«Niente spoiler, Marco.»', onPick: () => { S.marco = 'rifiutato'; S.repMaster++; say('«Ho visto Marco sgattaiolare via. Brava, ranocchia.»', 2400); } },
    ],
  });
}
function rollD20() {
  if (S.d20) return;
  const n = 1 + Math.floor(Math.random() * 20);
  S.d20 = n;
  const low = n <= 10;
  sfx('dice');
  openDialog({
    art: 'd20', name: 'IL MASTER TIRA IL D20', line: `<span style="font-size:44px;font-weight:600;color:var(--gold)">${n}</span><br>` + (low
      ? '«Basso! Marco ha portato un amico: c\'è un giocatore in più. Aggiungo uno slot... e va armato anche lui.»'
      : '«Alto! Stasera mi sento generoso: ti regalo 10 monete per le spese. Non ci abituare.»'),
    choices: [{ label: low ? 'NOOO' : 'GRAZIE, CAPO', sub: low ? 'Compare un terzo slot nella tesoreria' : '+10 monete', onPick: () => {
      if (low) { R.slotPos.push({ ...R.def.slotExtra }); R.slots.push(null); } else S.money += 10;
      renderRoom();
    } }],
  });
}

function renderFinal() {
  const all = [...S.history.flatMap(h => h.results), ...S.results];
  const vote = all.reduce((a, r) => a + (r.clean ? 1 : 0) + (r.rules ? 1 : 0), 0);
  const mHigh = S.repMaster >= 4, cHigh = S.repCreature >= 2;
  const E = mHigh && cHigh ? ['MASTER E MOSTRI TI ADORANO', 'Il Master ti nomina co-Master. Le creature ti hanno fatto una statua (piccola, verde, un po\' storta).', ['master', 'flippy', 'goblin', 'cugino']]
    : mHigh ? ['BRACCIO DESTRO DEL MASTER', 'Il Master non scrive più un dungeon senza di te. Le creature, però, ti chiamano "la spia arancione".', ['master', 'flippy']]
    : cHigh ? ['REGINA DEL SOTTOSUOLO', 'Le creature del dungeon ti seguirebbero ovunque. Il Master sta valutando di assumere un rospo al tuo posto.', ['goblin', 'flippy', 'ragno', 'slime']]
    : ['DI NUOVO ALLO STAGNO', 'Il Master cerca un\'altra rana per la prossima sessione. Le creature fanno finta di non conoscerti.', ['flippy', 'girino']];
  const pct = (v, max) => Math.max(5, Math.min(100, ((v + 3) / (max + 3)) * 100));
  $('#scr-ending').innerHTML = `
    <div class="end-wrap">
      <div class="kicker">FINE DELLA BETA · DUE SESSIONI GIOCATE</div>
      <div class="art">${E[2].map(a => `<img src="${A(a)}" alt="">`).join('')}</div>
      <h1>${E[0]}</h1>
      <p>${E[1]}</p>
      <div class="bars">
        <div>Reputazione col Master<div class="bar"><i style="width:${pct(S.repMaster, 7)}%"></i></div></div>
        <div>Reputazione con le creature<div class="bar"><i style="width:${pct(S.repCreature, 4)}%;background:var(--good)"></i></div></div>
      </div>
      <p class="muted" style="font-size:16px">Voto totale ${vote}/10 · Sessione 1: «${S.history[0].ending}» · ${S.final.total} monete in tasca</p>
      <p class="gold" style="font-size:18px">«La prossima settimana? Le Fogne. Porta gli stivali.» — il Master</p>
      <button class="btn" id="btn-again">GIOCA ANCORA</button>
    </div>`;
  $('#btn-again').onclick = () => { sfx('click'); renderTitle(); };
}

/* Avvio */
renderTitle();

/* Hook per i test automatici */
window.__flippy = { get S() { return S; }, get R() { return R; } };
})();

</script>
</body>
</html>
